<!doctype html>
<html lang="bn">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/site.css">

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<script>

const VIDEOS = [
  { n: 1, q: "পানিতে চামচ ভাঙা দেখায় কেন?", topic: "প্রতিসরণ", scene: "রাতের পড়ার টেবিল থেকে জানালা দিয়ে উড়ে পুকুরে। আলো পানি থেকে বাতাসে বেঁকে যায়, তাই চামচ ভাঙা দেখায়।" },
  { n: 2, q: "লোহা ডোবে, তাহলে লোহার জাহাজ ভাসে কেন?", topic: "প্লবতা", scene: "সন্ধ্যার নদীঘাট, নদীর প্রস্থচ্ছেদ, তারপর রাতের সমুদ্র। আর শেষে টাইটানিক কেন ডুবলো।" },
  { n: 3, q: "একই জোরে চাপ, তবু সুঁচ ঢোকে আঙুল ঢোকে না কেন?", topic: "চাপ", scene: "রাতের দর্জির দোকান থেকে কাদার রাস্তায়, যেখানে ট্রাক আটকে যায় আর হাতি হেঁটে যায়।" },
  { n: 4, q: "নদীর বাঁধ নিচে এত মোটা কেন?", topic: "তরলের চাপ", scene: "সকালের পাহাড়ি বাঁধ প্রস্থচ্ছেদে, দুই পাত্রের পরীক্ষা, গ্রামের পুকুরে ডুবুরি।" },
  { n: 5, q: "এভারেস্টে পানি ফুটছে, তবু ভাত সেদ্ধ হয় না কেন?", topic: "স্ফুটনাঙ্ক", scene: "ভোরের এভারেস্ট চূড়া থেকে মেঘ ভেদ করে সমুদ্রসৈকতে, তারপর রান্নাঘরের প্রেসার কুকার।" },
  { n: 6, q: "বরফ কঠিন, তবু পানিতে ভাসে কেন?", topic: "ঘনত্ব", scene: "ঢাকার শরবতের গাড়ির গ্লাস থেকে ঘনত্বের কিউব, তারপর জমে যাওয়া শীতের হ্রদের নিচে।" },
  { n: 7, q: "ঘামলে ফ্যানের বাতাস বেশি ঠান্ডা লাগে কেন?", topic: "সুপ্ততাপ", scene: "ঢাকার শোবার ঘরের সিলিং ফ্যান থেকে হাতের চামড়ার ভেতরে, তারপর মাটির কলসি।" },
  { n: 8, q: "রেললাইনে ফাঁক রাখে কেন?", topic: "দৈর্ঘ্য প্রসারণ", scene: "ধানক্ষেতের মাঝের রেললাইন, গরমে বেঁকে যাওয়া রেল, রোলারের ওপর বসানো লোহার সেতু।" },
  { n: 15, curious: true, q: "উড়ন্ত গাড়ি! টেসলা রোডস্টার উড়লো কীভাবে?", topic: "কৌতূহল", scene: "রাতের টেক্সাস টেস্ট সাইট থেকে ১৯৭৮-এর ফ্যান কার, তারপর মহাকাশে ঘুরতে থাকা ২০১৮-এর রোডস্টার।" },
];
/* Curiosity series number → script number */
const CURIOSITY = { 1: 15 };
const SOON = [
  { n: 9, q: "গরম পানিতে মোটা গ্লাসটাই ফাটে কেন?", tag: "অসম প্রসারণ" },
  { n: 10, q: "পুকুর জমে বরফ, তবু নিচে মাছ বাঁচে কীভাবে?", tag: "পানির ব্যতিক্রমী প্রসারণ" },
  { n: 11, q: "ঘুটঘুটে অন্ধকারে বাদুড় ধাক্কা খায় না কেন?", tag: "শব্দোত্তর তরঙ্গ" },
  { n: 12, q: "পাহাড়ে প্রতিধ্বনি হয়, নিজের ঘরে হয় না কেন?", tag: "প্রতিধ্বনি" },
  { n: 13, q: "গাড়ির সাইড মিরর 'মিথ্যা' বলে কেন?", tag: "উত্তল দর্পণ" },
  { n: 14, q: "আঠা ছাড়াই বেলুন দেয়ালে আটকে যায় কেন?", tag: "স্থির তড়িৎ" },
];
const QUIZ = [
  { from: 2, q: "লোহার পেরেক ডুবে যায়, অথচ লোহার জাহাজ ভাসে। কেন?",
    opts: ["জাহাজ বিশেষ হালকা লোহায় তৈরি", "ফাঁপা আকৃতির জন্য জাহাজ নিজের ওজনের সমান পানি সরাতে পারে", "ইঞ্জিন জাহাজকে উপরে ঠেলে রাখে"], a: 1,
    why: "বস্তু যতটা পানি সরায়, পানি ততটাই ঊর্ধ্বমুখী বল দেয় (আর্কিমিডিসের নীতি)। জাহাজের খোল ফাঁপা বলে অনেক বেশি পানি সরায়।" },
  { from: 5, q: "এভারেস্টের চূড়ায় পানি ১০০°C-এর অনেক কমে ফুটে যায়। কারণ?",
    opts: ["সেখানে বায়ুচাপ কম", "সেখানে ঠান্ডা বেশি", "পাহাড়ের পানি বেশি বিশুদ্ধ"], a: 0,
    why: "বায়ুচাপ কমলে স্ফুটনাঙ্কও কমে। চূড়ায় পানি প্রায় ৭০°C-এ ফোটে, তাই ভাত সেদ্ধ হতে চায় না।" },
  { from: 8, q: "রেললাইনের দুই পাতের জোড়ায় ফাঁক রাখা হয় কেন?",
    opts: ["ট্রেনের শব্দ কমাতে", "লোহা বাঁচাতে", "গরমে পাত লম্বা হলেও যেন বেঁকে না যায়"], a: 2,
    why: "তাপ পেলে কঠিন পদার্থের দৈর্ঘ্য বাড়ে (দৈর্ঘ্য প্রসারণ)। ফাঁক না থাকলে গরমের দিনে রেলপাত ঠেলাঠেলি করে বেঁকে যেত।" },
];
/* Live list: /api/videos (Cloudflare function) returns the page's posted videos.
   Each is matched to VIDEOS by the "Elora বিজ্ঞান #n" tag in its caption. Without the API
   (GitHub Pages, preview) the static list above is shown. */
const fbUrl = (p) => (/^https?:/.test(p) ? p : "https://www.facebook.com" + p);
const seriesNo = (text) => {
  const m = (text || "").match(/Elora (বিজ্ঞান|কৌতূহল)\s*#\s*([০-৯0-9]+)/);
  if (!m) return null;
  const k = Number(m[2].replace(/[০-৯]/g, (d) => "০১২৩৪৫৬৭৮৯".indexOf(d)));
  return m[1] === "কৌতূহল" ? CURIOSITY[k] || null : k;
};
const LAST = "eloraed-videos";
const readLast = () => { try { return JSON.parse(localStorage.getItem(LAST)) || null; } catch (e) { return null; } };
function useVideos() {
  // null = no API here (GitHub Pages, preview): show the built-in list.
  // On Cloudflare the API decides; if Facebook fails, keep the last list this browser saw.
  const [live, setLive] = useState(readLast);
  useEffect(() => {
    fetch("api/videos").then((r) => (r.status === 404 ? null : r.json())).then((d) => {
      if (!d || !d.videos) return;
      if (d.videos.length) { setLive(d.videos); try { localStorage.setItem(LAST, JSON.stringify(d.videos)); } catch (e) {} }
      else setLive((prev) => prev || []);
    }).catch(() => {});
  }, []);
  if (!live) return VIDEOS;
  return live.map((f) => {
    const n = seriesNo(f.description);
    const known = VIDEOS.find((v) => v.n === n);
    const lines = f.description.split("\n").map((s) => s.trim()).filter(Boolean);
    return known
      ? { ...known, key: f.id, fb: fbUrl(f.permalink_url) }
      : { n, key: f.id, q: (lines[0] || "নতুন ভিডিও").replace(/\s*\p{Extended_Pictographic}+\s*$/u, ""), topic: "নতুন", scene: lines[1] || "", img: f.thumb, fb: fbUrl(f.permalink_url) };
  });
}
const imgOf = (v) => v.img || `img/${String(v.n).padStart(2, "0")}.jpg`;

const TOPICS = ["প্রতিসরণ", "প্লবতা", "চাপ", "তরলের চাপ", "স্ফুটনাঙ্ক", "ঘনত্ব", "সুপ্ততাপ", "দৈর্ঘ্য প্রসারণ", "প্রতিধ্বনি", "স্থির তড়িৎ"];

function Counter({ to }) {
  const [v, setV] = useState(reduced ? to : 0);
  useEffect(() => {
    if (reduced) return;
    let raf, t0;
    const step = (t) => { t0 ??= t; const k = Math.min(1, (t - t0) / 1100); setV(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [to]);
  return bn(v);
}

function Hero({ count }) {
  const ref = useRef(null);
  useEffect(() => {
    if (reduced) return;
    const el = ref.current;
    const onMove = (e) => { el.style.setProperty("--mx", (e.clientX / innerWidth - .5) * 2); el.style.setProperty("--my", (e.clientY / innerHeight - .5) * 2); };
    addEventListener("pointermove", onMove);
    return () => removeEventListener("pointermove", onMove);
  }, []);
  return html`<header className="hero" id="top" ref=${ref}>
    <div className="blob o"></div><div className="blob p"></div>
    <div className="wrap hero-grid">
      <div>
        <span className="chip"><b>SSC ২০২৭</b>পদার্থবিজ্ঞান · NCTB সিলেবাস</span>
        <h1>বিজ্ঞান মুখস্থের না, <span className="grad">চোখে</span> <span className="u">দেখার<svg viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M2 14 C 50 4, 120 4, 198 12"/></svg></span> জিনিস</h1>
        <p className="lede">বইয়ের কঠিন অধ্যায়, এক মিনিটের সিনেমার মতো অ্যানিমেশনে। চামচ কেন ভাঙা দেখায়, জাহাজ কেন ভাসে, সব নিজের চোখে দেখে বোঝো। শেষে একটা প্রশ্ন, উত্তর কমেন্টে।</p>
        <div className="ctas">
          <${Magnet} href=${FB} className="pill pill-orange"><${FbIcon} />Facebook-এ ফলো করো<//>
          <${Magnet} className="pill pill-ghost" onClick=${() => document.getElementById("videos").scrollIntoView()}>ভিডিওগুলো দেখো<//>
        </div>
        <div className="stats">
          <div className="stat"><b><${Counter} to=${count} />টি</b><span>ভিডিও প্রকাশিত</span></div>
          <div className="stat"><b><${Counter} to=${60} />সে.</b><span>একটা ধারণা, এক মিনিটে</span></div>
          <div className="stat"><b><${Counter} to=${9} />টি</b><span>বোর্ডের সিলেবাস</span></div>
        </div>
      </div>
      <div className="stage" aria-hidden="true">
        <div className="ring r2"></div><div className="ring"></div>
        <div className="mascot"><img src="img/logo.png" alt="" /></div>
        <div className="formula" style=${{ left: "-4%", top: "14%", "--d": -26 }}><small>প্রতিসরণাঙ্ক</small>n = <i>১.৩৩</i></div>
        <div className="formula" style=${{ right: "-2%", top: "6%", "--d": 20 }}><small>চাপ</small>P = <i>F / A</i></div>
        <div className="formula" style=${{ right: "-6%", bottom: "20%", "--d": -16 }}><small>ঘনত্ব</small>ρ = <i>m / V</i></div>
        <div className="formula" style=${{ left: "2%", bottom: "8%", "--d": 30 }}><small>এভারেস্টে পানি ফোটে</small><i>~৭০°C</i></div>
      </div>
    </div>
  </header>`;
}

function Band() {
  const items = [...TOPICS, ...TOPICS];
  return html`<div className="band" aria-hidden="true"><div className="track">${items.map((t, i) => html`<span key=${i}>${t}</span>`)}</div></div>`;
}

function VideoCard({ v, onOpen }) {
  const ref = useRef(null);
  const move = (e) => {
    if (reduced) return;
    const r = ref.current.getBoundingClientRect();
    ref.current.style.setProperty("--ry", `${((e.clientX - r.left) / r.width - .5) * 14}deg`);
    ref.current.style.setProperty("--rx", `${-((e.clientY - r.top) / r.height - .5) * 14}deg`);
  };
  const leave = () => { ref.current.style.setProperty("--rx", "0deg"); ref.current.style.setProperty("--ry", "0deg"); };
  return html`<button className="vcard" ref=${ref} onMouseMove=${move} onMouseLeave=${leave} onClick=${() => onOpen(v)} aria-label=${v.q}>
    <div className="phone">
      <img src=${imgOf(v)} alt="" loading="lazy" />
      ${v.n && html`<span className="badge">${v.curious ? "✦" : "#" + bn(v.n)}</span>`}
      <span className="play"><svg viewBox="0 0 10 12"><path d="M0 0l10 6-10 6z"/></svg></span>
      <div className="meta"><span className="topic">${v.topic}</span><h3>${v.q}</h3></div>
    </div>
  </button>`;
}

function Videos({ videos, onOpen }) {
  const rail = useRef(null);
  const by = (d) => rail.current && rail.current.scrollBy({ left: d * rail.current.clientWidth * .8, behavior: reduced ? "auto" : "smooth" });
  return html`<section className="block" id="videos"><div className="wrap">
    <${Reveal} className="head">
      <div><p className="eyebrow">Elora বিজ্ঞান সিরিজ</p><h2>এ পর্যন্ত <span className="grad">${bn(videos.length)}টা প্রশ্নের</span> উত্তর</h2></div>
      <div className="arrows"><button onClick=${() => by(-1)} aria-label="আগের ভিডিও"><${Arrow} left /></button><button onClick=${() => by(1)} aria-label="পরের ভিডিও"><${Arrow} /></button></div>
    <//>
    <${Reveal}>${videos.length
      ? html`<div className="rail" ref=${rail}>${videos.map((v) => html`<${VideoCard} key=${v.key || v.n} v=${v} onOpen=${onOpen} />`)}</div>`
      : html`<p className="lede">ভিডিওগুলো এই মুহূর্তে লোড হচ্ছে না। সব ভিডিও দেখো <a href=${FB} target="_blank" rel="noopener" style=${{ color: "var(--orange-2)", fontWeight: 700 }}>আমাদের Facebook পেজে</a>।</p>`}<//>
  </div></section>`;
}

function How() {
  const ref = useRef(null);
  const [s, setS] = useState(reduced ? 1 : 0);
  useEffect(() => {
    if (reduced) return;
    const onScroll = () => {
      const r = ref.current.getBoundingClientRect();
      setS(Math.max(0, Math.min(1, (innerHeight * .75 - r.top) / (r.height + innerHeight * .25))));
    };
    onScroll();
    addEventListener("scroll", onScroll, { passive: true });
    return () => removeEventListener("scroll", onScroll);
  }, []);
  const steps = [
    ["প্রথম ২ সেকেন্ড", "প্রশ্ন", "রোজকার জীবনের একটা অদ্ভুত ঘটনা। দেখেই মনে হবে, আরে, তাই তো!"],
    ["মাঝখানে", "দেখো", "ক্যামেরা ঢুকে যায় ঘটনার ভেতরে। কারণ থেকে ফলাফল, ধাপে ধাপে।"],
    ["শেষের দিকে", "মনে রাখো", "পরীক্ষার খাতায় লেখার মতো এক লাইনের মূল কথা।"],
    ["শেষে", "তোমার পালা", "একটা প্রশ্ন। উত্তর লেখো কমেন্টে, বন্ধুকে ট্যাগ করো।"],
  ];
  return html`<section className="block" id="how"><div className="wrap">
    <${Reveal} className="head"><div><p className="eyebrow">প্রতিটা ভিডিও যেভাবে চলে</p><h2>এক মিনিটে <span className="grad">একটা পুরো</span> ধারণা</h2></div><//>
    <div className="steps" ref=${ref} style=${{ "--s": s }}>
      <div className="steps-line"><i></i></div>
      ${steps.map(([when, t, p], i) => html`<${Reveal} key=${i} className=${`step ${s > i / 4 + .05 ? "on" : ""}`} style=${{ transitionDelay: `${i * 80}ms` }}>
        <div className="dot">${bn(i + 1)}</div>
        <div className="peel"><span className="when">${when}</span><h3>${t}</h3><p>${p}</p></div>
      <//>`)}
    </div>
  </div></section>`;
}

function Quiz() {
  const [i, setI] = useState(0);
  const [pick, setPick] = useState(null);
  const [score, setScore] = useState(0);
  const q = QUIZ[i];
  const choose = (k) => { if (pick !== null) return; setPick(k); if (k === q.a) setScore((x) => x + 1); };
  const next = () => { setPick(null); setI((i + 1) % QUIZ.length); if (i + 1 === QUIZ.length) setScore(0); };
  return html`<section className="block" id="quiz"><div className="wrap">
    <${Reveal} className="quiz">
      <div className="qside">
        <p className="eyebrow" style=${{ color: "#fff" }}>তোমার পালা</p>
        <h2>ভিডিও দেখেছো? তাহলে বলো তো…</h2>
        <p>প্রতিটা ভিডিওর শেষে এমন একটা প্রশ্ন থাকে। এখানে তিনটা দিয়ে নিজেকে যাচাই করো।</p>
        <span className="score">স্কোর: ${bn(score)} / ${bn(QUIZ.length)}</span>
        <img src="img/logo.png" alt="" />
      </div>
      <div className="qcard" aria-live="polite">
        <div className="qtop"><span>প্রশ্ন ${bn(i + 1)} · ভিডিও #${bn(q.from)} থেকে</span><span className="dots">${QUIZ.map((_, k) => html`<i key=${k} className=${k <= i ? "on" : ""}></i>`)}</span></div>
        <h3>${q.q}</h3>
        ${q.opts.map((o, k) => html`<button key=${i + "-" + k} className=${`opt ${pick !== null && k === q.a ? "right" : ""} ${pick === k && k !== q.a ? "wrong" : ""}`} disabled=${pick !== null} onClick=${() => choose(k)}>
          <span className="k">${"কখগ"[k]}</span>${o}</button>`)}
        ${pick !== null && html`<div className="why"><b>${pick === q.a ? "ঠিক বলেছো! " : "উঁহু, প্রায় হয়েছিল। "}</b>${q.why}</div>`}
        ${pick !== null && html`<button className="pill pill-orange next" onClick=${next}>${i + 1 === QUIZ.length ? "আবার শুরু করো" : "পরের প্রশ্ন"} →</button>`}
      </div>
    <//>
  </div></section>`;
}

function Soon({ posted }) {
  const made = VIDEOS.filter((v) => !v.curious).map((v) => ({ n: v.n, q: v.q, tag: v.topic }));
  const left = [...made, ...SOON].filter((s) => !posted.has(s.n));
  if (!left.length) return null;
  return html`<section className="block" id="soon"><div className="wrap">
    <${Reveal} className="head"><div><p className="eyebrow">আসছে</p><h2>পরের <span className="grad">প্রশ্নগুলো</span></h2></div><//>
    <div className="soon">${left.map((s, i) => html`<${Reveal} key=${s.n} className="scard" style=${{ transitionDelay: `${(i % 3) * 70}ms` }}>
      <span className="n">${bn(String(s.n).padStart(2, "0"))}</span><h3>${s.q}</h3><span className="tag">${s.tag}</span>
    <//>`)}</div>
  </div></section>`;
}

function Final() {
  const stars = useRef(null);
  useEffect(() => {
    const c = stars.current, ctx = c.getContext("2d");
    const draw = () => {
      const w = c.width = c.offsetWidth * devicePixelRatio, h = c.height = c.offsetHeight * devicePixelRatio;
      for (let i = 0; i < 90; i++) {
        const r = (k) => { const x = Math.sin((i + 1) * 12.9898 + k * 78.233) * 43758.5; return x - Math.floor(x); };
        ctx.globalAlpha = .2 + r(3) * .6; ctx.fillStyle = r(4) > .7 ? "#c99bff" : "#fff4e4";
        ctx.beginPath(); ctx.arc(r(1) * w, r(2) * h, (r(5) * 1.4 + .4) * devicePixelRatio, 0, 7); ctx.fill();
      }
    };
    draw(); addEventListener("resize", draw);
    return () => removeEventListener("resize", draw);
  }, []);
  return html`<section className="final"><div className="wrap">
    <${Reveal} className="final-in">
      <canvas className="stars" ref=${stars}></canvas>
      <div style=${{ position: "relative" }}>
        <h2>নতুন ভিডিও <span className="grad" style=${{ backgroundImage: "linear-gradient(100deg,#ffb36b,#ff7a1a,#c99bff)" }}>মিস করো না</span></h2>
        <p>প্রতি সপ্তাহে নতুন প্রশ্ন, নতুন উত্তর। ফলো করো, আর যে বন্ধু বিজ্ঞানকে ভয় পায় তাকে ট্যাগ করো।</p>
        <div className="ctas"><${Magnet} href=${FB} className="pill pill-orange"><${FbIcon} />Facebook-এ ফলো করো<//></div>
      </div>
      <img className="peek" src="img/logo.png" alt="" />
    <//>
    <div className="foot"><span>© ২০২৬ EloraEd · এলোরা বিজ্ঞান</span><span>ঢাকা · চট্টগ্রাম · রাজশাহী · কুমিল্লা · যশোর · বরিশাল · সিলেট · দিনাজপুর · ময়মনসিংহ</span></div>
  </div></section>`;
}

function Modal({ v, onClose }) {
  useEffect(() => {
    const k = (e) => e.key === "Escape" && onClose();
    addEventListener("keydown", k);
    return () => removeEventListener("keydown", k);
  }, [onClose]);
  const player = v.fb && `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(v.fb)}&show_text=false&width=280&height=498`;
  return html`<div className="modal" role="dialog" aria-modal="true" aria-label=${v.q} onClick=${(e) => e.target === e.currentTarget && onClose()}>
    <button className="close" onClick=${onClose} aria-label="বন্ধ করো">✕</button>
    <div className="sheet">
      <div className="phone">${player
        ? html`<iframe src=${player} title=${v.q} style=${{ width: "100%", height: "100%", border: 0 }} allow="autoplay; encrypted-media; picture-in-picture; web-share" allowFullScreen></iframe>`
        : html`<img src=${imgOf(v)} alt="" />`}</div>
      <div>
        <span className="topic">${v.topic}</span>
        <h3>${v.q}</h3>
        <p className="scene">${v.scene}</p>
        <${Magnet} href=${v.fb || FB} className="pill pill-orange"><${FbIcon} />Facebook-এ ভিডিওটা দেখো<//>
      </div>
    </div>
  </div>`;
}

/* 3D props along the page: x = share of half the screen width (− left), dy = screens below the anchor's top, z < 0 = farther (slower parallax) */
const PROPS = [ // one per section (two in the hero)
  { kind: "atom", at: "#top", dy: .12, x: -.9, z: -150, size: 120, mobile: false },
  { kind: "prism", at: "#top", dy: .5, x: -.03, z: 0, size: 105, mobile: false, keep: true },
  { kind: "books", at: "#videos", dy: .45, x: -.9, z: -80, size: 130 },
  { kind: "flask", at: "#how", dy: .35, x: .88, z: 60, size: 115 },
  { kind: "planet", at: "#quiz", dy: .4, x: -.92, z: -250, size: 150 },
  { kind: "laptop", at: "#shop", dy: .05, x: .9, z: -120, size: 125 },
  { kind: "cap", at: "#soon", dy: .2, x: -.9, z: -60, size: 110 },
];

/* Home teaser for the shop: shows featured products when there are any */
function ShopTeaser() {
  const [items, setItems] = useState([]);
  useEffect(() => {
    fetch("api/products").then((r) => (r.ok ? r.json() : null)).then((d) => d && setItems((d.products || []).filter((p) => p.featured).slice(0, 3))).catch(() => {});
  }, []);
  return html`<section className="block" id="shop"><div className="wrap">
    <${Reveal} className="head">
      <div><p className="eyebrow">EloraEd শপ</p><h2>বই, নোট, ক্লাস, <span className="grad">সব এক জায়গায়</span></h2></div>
      <${Magnet} href="shop" newTab=${false} className="pill pill-orange"><${BagIcon} />শপে যাও<//>
    <//>
    ${items.length > 0 && html`<div className="teaser">${items.map((p) => html`<${Reveal} key=${p.id} as="a" className="tcard" href=${"shop#" + p.id}>
      <div className="timg">${p.image ? html`<img src=${p.image} alt="" loading="lazy" />` : html`<span>${p.type}</span>`}</div>
      <div><span className="topic">${p.type}</span><h3>${p.title}</h3><b>${taka(p.price)}</b></div>
    <//>`)}</div>`}
  </div></section>`;
}

function App() {
  const videos = useVideos();
  const posted = new Set(videos.map((v) => v.n));
  const [open, setOpen] = useState(null);
  const close = useCallback(() => setOpen(null), []);
  const bar = useRef(null);
  useEffect(() => {
    const onScroll = () => { const h = document.documentElement; bar.current.style.setProperty("--p", h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight)); };
    addEventListener("scroll", onScroll, { passive: true });
    return () => removeEventListener("scroll", onScroll);
  }, []);
  useEffect(() => { window.Scene3D && Scene3D.start(PROPS); }, []);
  return html`<div className="progress" ref=${bar}></div>
    <${Nav} /><${Hero} count=${videos.length} /><${Band} />
    <main><${Videos} videos=${videos} onOpen=${setOpen} /><${How} /><${Quiz} /><${ShopTeaser} /><${Soon} posted=${posted} /></main>
    <${Final} />
    ${open && html`<${Modal} v=${open} onClose=${close} />`}`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
