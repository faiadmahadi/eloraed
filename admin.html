<!doctype html>
<html lang="bn">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="img/logo.png">
<title>EloraEd ড্যাশবোর্ড</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/shop.css">
<style>
body { font-size: 16px; }
.dash { padding-block: 20px 60px; }
.dtop { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
.dtop .logo { margin-right: auto; }
.dtabs { display: flex; gap: 6px; padding: 5px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
.dtabs button { padding: 8px 18px; border-radius: 999px; border: 0; background: none; font-weight: 700; color: var(--muted); }
.dtabs button.on { background: var(--ink); color: var(--bg); }
.dtabs i { font-style: normal; margin-left: 6px; padding: 0 7px; border-radius: 999px; background: var(--orange); color: #fff; font-size: 12px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--orange); }
.btn.red { color: var(--bad); }
.btn.red:hover { border-color: var(--bad); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 22px; min-width: 0; }
.panel h2 { font-size: 26px; margin: 0 0 4px; }
.hint { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.thumb { flex: none; width: 64px; height: 64px; border-radius: 14px; overflow: hidden; background: var(--bg-2); position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb .gen { padding: 6px; } .thumb .gen b, .thumb .gen span { display: none; }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t small { color: var(--muted); }
.row .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.off { opacity: .5; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 0 8px; border-radius: 999px; background: var(--bg-2); margin-left: 6px; }
.editor { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr); gap: 20px; align-items: start; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fgrid .full { grid-column: 1 / -1; }
.f { display: grid; gap: 4px; font-size: 14px; font-weight: 600; color: var(--muted); }
.f input, .f textarea, .f select { font: inherit; font-size: 16px; color: var(--ink); padding: 10px 13px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); width: 100%; min-width: 0; }
.f input:focus, .f textarea:focus { outline: none; border-color: var(--orange); }
.f small { font-weight: 400; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { padding: 4px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--bg); font-size: 14px; font-weight: 600; }
.chips button.on { border-color: var(--orange); color: var(--orange-2); }
.checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.checks label { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.checks input { width: 18px; height: 18px; accent-color: var(--orange); }
.drop { display: grid; place-items: center; gap: 6px; min-height: 120px; border-radius: 16px; border: 2px dashed var(--line); background: var(--bg); text-align: center; padding: 14px; cursor: pointer; color: var(--muted); }
.drop.over { border-color: var(--orange); }
.drop img { max-height: 160px; border-radius: 10px; }
.sticky { position: sticky; top: 16px; }
.sticky .pcard { pointer-events: none; }
.bar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.msg { padding: 10px 14px; border-radius: 12px; font-weight: 600; margin: 0 0 14px; }
.msg.ok { background: color-mix(in srgb, var(--ok) 14%, var(--card)); color: var(--ok); }
.msg.bad { background: color-mix(in srgb, var(--bad) 12%, var(--card)); color: var(--bad); }
.ocard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; padding: 16px 0; border-top: 1px solid var(--line); }
.ocard:first-of-type { border-top: 0; }
.ocard h3 { font-family: var(--body); font-weight: 700; font-size: 17px; margin: 0; }
.ocard dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 6px 0 0; font-size: 15px; }
.ocard dt { color: var(--muted); }
.ocard dd { margin: 0; overflow-wrap: anywhere; }
.ocard .side { display: grid; gap: 8px; align-content: start; justify-items: end; }
.st { font-weight: 700; font-size: 13px; padding: 2px 10px; border-radius: 999px; }
.st.new { background: color-mix(in srgb, var(--orange) 18%, var(--card)); color: var(--orange-2); }
.st.paid { background: color-mix(in srgb, var(--purple) 16%, var(--card)); color: var(--purple); }
.st.done { background: color-mix(in srgb, var(--ok) 16%, var(--card)); color: var(--ok); }
.st.cancelled { background: var(--bg-2); color: var(--muted); }
.login { max-width: 420px; margin: 12vh auto 0; text-align: center; }
.login img { width: 96px; }
.login form { display: grid; gap: 12px; margin-top: 18px; text-align: left; }
@media (max-width: 900px) {
  .editor { grid-template-columns: 1fr; }
  .sticky { position: static; }
}
@media (max-width: 560px) {
  .fgrid { grid-template-columns: 1fr; }
  .row { flex-wrap: wrap; }
  .row .acts { width: 100%; justify-content: flex-start; }
  .ocard { grid-template-columns: 1fr; }
  .ocard .side { justify-items: start; }
}
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="js/common.js"></script>
<script>
const TYPES = ["বই", "ই-বুক", "নোট", "ক্লাস", "কোর্স", "মডেল টেস্ট"];
const STATUS = { new: "নতুন", paid: "পেমেন্ট পেয়েছি", done: "ডেলিভারি হয়েছে", cancelled: "বাতিল" };
const KEY = "eloraed-admin";
const store = { get: () => { try { return sessionStorage.getItem(KEY) || localStorage.getItem(KEY) || ""; } catch (e) { return ""; } },
  set: (v, keep) => { try { (keep ? localStorage : sessionStorage).setItem(KEY, v); } catch (e) {} },
  clear: () => { try { sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); } catch (e) {} } };

let PW = store.get();
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { authorization: "Bearer " + PW, ...(opts.json ? { "content-type": "application/json" } : {}), ...(opts.headers || {}) }, body: opts.json ? JSON.stringify(opts.json) : opts.body });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { store.clear(); PW = ""; location.reload(); }
  if (!r.ok) throw new Error(d.error || "কিছু একটা ভুল হয়েছে (" + r.status + ")");
  return d;
}

/* Shrinks a picture to at most 1200 px and JPEG, so uploads stay small */
function shrink(file) {
  return new Promise((ok, fail) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1200 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => (b ? ok(b) : fail(new Error("ছবিটা পড়া যায়নি"))), "image/jpeg", .85);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => fail(new Error("এটা ছবি না, বা ছবিটা পড়া যায়নি"));
    img.src = URL.createObjectURL(file);
  });
}

const COVER = { "বই": ["#f2541e", "#8e2bd6"], "ই-বুক": ["#8e2bd6", "#4e1478"], "নোট": ["#ffb347", "#f2541e"], "ক্লাস": ["#c42a2a", "#2a0a2e"], "কোর্স": ["#ff7a1a", "#8e2bd6"] };
function Cover({ p }) {
  if (p.image) return html`<img src=${p.image} alt="" />`;
  const [a, b] = COVER[p.type] || ["#ff7a1a", "#8e2bd6"];
  return html`<div className="gen" style=${{ background: `radial-gradient(circle at 80% 10%, rgba(255,255,255,.3), transparent 45%), linear-gradient(150deg, ${a}, ${b})` }}><span>${p.type}</span><b>${p.title || "পণ্যের নাম"}</b><img src="img/logo.png" alt="" /></div>`;
}
const num = (v) => Number(String(v || "").replace(/[০-৯]/g, (d) => "০১২৩৪৫৬৭৮৯".indexOf(d))) || 0;

function Login() {
  const [pw, setPw] = useState("");
  const [keep, setKeep] = useState(true);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const go = async (e) => {
    e.preventDefault(); setBusy(true); setErr("");
    const r = await fetch("api/login", { method: "POST", headers: { authorization: "Bearer " + pw } }).catch(() => null);
    const d = r ? await r.json().catch(() => ({})) : {};
    if (r && r.ok) { store.set(pw, keep); location.reload(); }
    else { setErr(r ? d.error || "ঢোকা গেল না" : "সার্ভারে পৌঁছানো যায়নি"); setBusy(false); }
  };
  return html`<div className="wrap"><div className="login panel">
    <img src="img/logo.png" alt="" />
    <h2>EloraEd ড্যাশবোর্ড</h2>
    <p className="hint">শপের পণ্য আর অর্ডার সামলানোর জায়গা।</p>
    <form onSubmit=${go}>
      <label className="f">পাসওয়ার্ড<input type="password" required autoFocus value=${pw} onInput=${(e) => setPw(e.target.value)} autoComplete="current-password" /></label>
      <div className="checks"><label><input type="checkbox" checked=${keep} onChange=${(e) => setKeep(e.target.checked)} />এই ডিভাইসে মনে রাখো</label></div>
      ${err && html`<p className="msg bad">${err}</p>`}
      <button className="pill pill-orange" disabled=${busy}>${busy ? "দেখছি…" : "ঢোকো"}</button>
    </form>
  </div></div>`;
}

const BLANK = { type: "বই", title: "", subtitle: "", price: "", oldPrice: "", badge: "", info: "", description: "", features: "", image: "", link: "", needsAddress: true, featured: false, active: true, sort: 0 };

function Editor({ start, onSaved, onCancel }) {
  const [p, setP] = useState(() => ({ ...BLANK, ...start, features: Array.isArray(start.features) ? start.features.join("\n") : start.features || "" }));
  const [busy, setBusy] = useState(false);
  const [up, setUp] = useState(false);
  const [err, setErr] = useState("");
  const [over, setOver] = useState(false);
  const file = useRef(null);
  const set = (k) => (e) => setP({ ...p, [k]: e.target.type === "checkbox" ? e.target.checked : e.target.value });
  const pickType = (t) => setP({ ...p, type: t, needsAddress: t === "বই" ? true : p.type === "বই" ? false : p.needsAddress });
  const upload = async (f) => {
    if (!f) return;
    setUp(true); setErr("");
    try { const blob = await shrink(f); const d = await api("api/upload", { method: "POST", body: blob, headers: { "content-type": "image/jpeg" } }); setP((x) => ({ ...x, image: d.url })); }
    catch (e) { setErr(e.message); }
    setUp(false);
  };
  const save = async (e) => {
    e.preventDefault(); setBusy(true); setErr("");
    try { const d = await api("api/products", { method: "POST", json: { ...p, price: num(p.price), oldPrice: num(p.oldPrice) } }); onSaved(d.product); }
    catch (e2) { setErr(e2.message); setBusy(false); }
  };
  const preview = { ...p, price: num(p.price), oldPrice: num(p.oldPrice), features: [] };
  const off = preview.oldPrice > preview.price ? Math.round((1 - preview.price / preview.oldPrice) * 100) : 0;
  return html`<form className="editor" onSubmit=${save}>
    <div className="panel">
      <h2>${start.id ? "পণ্য বদলাও" : "নতুন পণ্য"}</h2>
      <p className="hint">শুধু নাম আর দাম লাগবেই। বাকিগুলো ইচ্ছা হলে।</p>
      ${err && html`<p className="msg bad">${err}</p>`}
      <div className="fgrid">
        <div className="f full">ধরন
          <div className="chips">${TYPES.map((t) => html`<button type="button" key=${t} className=${p.type === t ? "on" : ""} onClick=${() => pickType(t)}>${t}</button>`)}</div>
          <input value=${p.type} onInput=${set("type")} placeholder="অন্য কিছু হলে লেখো" />
        </div>
        <label className="f full">নাম *<input required value=${p.title} onInput=${set("title")} placeholder="যেমন: SSC পদার্থবিজ্ঞান ভিজ্যুয়াল নোট" /></label>
        <label className="f full">ছোট বর্ণনা<input value=${p.subtitle} onInput=${set("subtitle")} placeholder="এক লাইনে কী আছে" /></label>
        <label className="f">দাম (টাকা) *<input required inputMode="numeric" value=${p.price} onInput=${set("price")} placeholder="০ দিলে ফ্রি" /></label>
        <label className="f">আগের দাম <small>(ছাড় দেখাতে)</small><input inputMode="numeric" value=${p.oldPrice} onInput=${set("oldPrice")} /></label>
        <label className="f">ব্যাজ<input value=${p.badge} onInput=${set("badge")} placeholder="নতুন / বেস্টসেলার" /></label>
        <label className="f">এক লাইনের তথ্য<input value=${p.info} onInput=${set("info")} placeholder="১২টি ক্লাস · শুক্রবার রাত ৮টা" /></label>
        <label className="f full">বিস্তারিত<textarea rows="5" value=${p.description} onInput=${set("description")}></textarea></label>
        <label className="f full">যা যা পাবে <small>(প্রতি লাইনে একটা)</small><textarea rows="4" value=${p.features} onInput=${set("features")} placeholder=${"১১টি অধ্যায়\nরঙিন ছবি আর ডায়াগ্রাম\nবোর্ড প্রশ্নের সমাধান"}></textarea></label>
        <div className="f full">ছবি
          <div className=${`drop ${over ? "over" : ""}`} onClick=${() => file.current.click()}
            onDragOver=${(e) => { e.preventDefault(); setOver(true); }} onDragLeave=${() => setOver(false)}
            onDrop=${(e) => { e.preventDefault(); setOver(false); upload(e.dataTransfer.files[0]); }}>
            ${up ? "আপলোড হচ্ছে…" : p.image ? html`<img src=${p.image} alt="" />` : html`<span>ছবি এখানে টেনে আনো, বা ক্লিক করো<br /><small>না দিলে রঙিন কভার নিজে থেকেই তৈরি হবে</small></span>`}
          </div>
          <input ref=${file} type="file" accept="image/*" hidden onChange=${(e) => upload(e.target.files[0])} />
          ${p.image && html`<button type="button" className="btn red" style=${{ justifySelf: "start" }} onClick=${() => setP({ ...p, image: "" })}>ছবি সরাও</button>`}
        </div>
        <label className="f full">বাইরের লিংক <small>(ঐচ্ছিক, যেমন কোর্সের পেজ)</small><input type="url" value=${p.link} onInput=${set("link")} placeholder="https://" /></label>
        <label className="f">ক্রম <small>(ছোট সংখ্যা আগে দেখাবে)</small><input type="number" value=${p.sort} onInput=${set("sort")} /></label>
        <div className="f full"><div className="checks">
          <label><input type="checkbox" checked=${p.active} onChange=${set("active")} />শপে দেখাও</label>
          <label><input type="checkbox" checked=${p.featured} onChange=${set("featured")} />হোমপেজে দেখাও</label>
          <label><input type="checkbox" checked=${p.needsAddress} onChange=${set("needsAddress")} />ডেলিভারির ঠিকানা লাগবে</label>
        </div></div>
      </div>
      <div className="bar">
        <button className="pill pill-orange" disabled=${busy || up}>${busy ? "সেভ হচ্ছে…" : "সেভ করো"}</button>
        <button type="button" className="pill pill-ghost" onClick=${onCancel}>বাতিল</button>
      </div>
    </div>
    <div className="sticky">
      <p className="hint">শপে যেমন দেখাবে:</p>
      <div className="pcard">
        <div className="pimg"><${Cover} p=${preview} />${preview.badge && html`<span className="pbadge">${preview.badge}</span>`}</div>
        <div className="pbody">
          <span className="topic">${preview.type}</span><h3>${preview.title || "পণ্যের নাম"}</h3>
          ${preview.subtitle && html`<p className="sub">${preview.subtitle}</p>`}
          ${preview.info && html`<p className="info">${preview.info}</p>`}
          <div className="prow"><div className="price"><b>${preview.price ? taka(preview.price) : "ফ্রি"}</b>${off > 0 && html`<s>${taka(preview.oldPrice)}</s><em>${bn(off)}% ছাড়</em>`}</div><span className="go">বিস্তারিত →</span></div>
        </div>
      </div>
    </div>
  </form>`;
}

function Products() {
  const [list, setList] = useState(null);
  const [edit, setEdit] = useState(null);
  const [msg, setMsg] = useState("");
  const [err, setErr] = useState("");
  const load = () => api("api/products").then((d) => setList(d.products)).catch((e) => setErr(e.message));
  useEffect(() => { load(); }, []);
  const quick = async (p, patch) => {
    try { await api("api/products", { method: "POST", json: { ...p, ...patch } }); load(); } catch (e) { setErr(e.message); }
  };
  const del = async (p) => {
    if (!confirm(`"${p.title}" মুছে ফেলবে? এটা আর ফেরত আনা যাবে না।`)) return;
    try { await api("api/products?id=" + p.id, { method: "DELETE" }); setMsg("মুছে ফেলা হয়েছে।"); load(); } catch (e) { setErr(e.message); }
  };
  if (edit) return html`<${Editor} start=${edit} onCancel=${() => setEdit(null)} onSaved=${(p) => { setEdit(null); setMsg(`"${p.title}" সেভ হয়েছে।`); load(); }} />`;
  return html`<div className="panel">
    <div className="dtop" style=${{ marginBottom: 6 }}>
      <div style=${{ marginRight: "auto" }}><h2>পণ্য</h2><p className="hint" style=${{ margin: 0 }}>বই, ই-বুক, নোট, ক্লাস, কোর্স: যা বিক্রি করবে।</p></div>
      <a className="btn" href="shop" target="_blank">শপ দেখো ↗</a>
      <button className="pill pill-orange" onClick=${() => { setMsg(""); setEdit({}); }}>+ নতুন পণ্য</button>
    </div>
    ${msg && html`<p className="msg ok">${msg}</p>`}
    ${err && html`<p className="msg bad">${err}</p>`}
    ${list === null ? html`<p className="hint">লোড হচ্ছে…</p>` : list.length === 0 ? html`<p className="hint">এখনো কোনো পণ্য নেই। "নতুন পণ্য" চেপে প্রথমটা যোগ করো।</p>` :
      list.map((p) => html`<div key=${p.id} className=${`row ${p.active ? "" : "off"}`}>
        <div className="thumb"><${Cover} p=${p} /></div>
        <div className="t"><b>${p.title}</b><small>${p.type} · ${p.price ? taka(p.price) : "ফ্রি"}${!p.active ? html`<span className="tag">লুকানো</span>` : ""}${p.featured ? html`<span className="tag">হোমপেজে</span>` : ""}</small></div>
        <div className="acts">
          <button className="btn" onClick=${() => quick(p, { active: !p.active })}>${p.active ? "লুকাও" : "দেখাও"}</button>
          <button className="btn" onClick=${() => quick(p, { featured: !p.featured })}>${p.featured ? "★ হোমপেজ" : "☆ হোমপেজ"}</button>
          <button className="btn" onClick=${() => { setMsg(""); setEdit(p); }}>এডিট</button>
          <button className="btn red" onClick=${() => del(p)}>মুছো</button>
        </div>
      </div>`)}
  </div>`;
}

function Orders({ onCount }) {
  const [list, setList] = useState(null);
  const [filter, setFilter] = useState("all");
  const [err, setErr] = useState("");
  const load = () => api("api/orders").then((d) => { setList(d.orders); onCount(d.orders.filter((o) => o.status === "new").length); }).catch((e) => setErr(e.message));
  useEffect(() => { load(); }, []);
  const setStatus = async (o, status) => { try { await api("api/orders", { method: "PATCH", json: { id: o.id, status } }); load(); } catch (e) { setErr(e.message); } };
  const del = async (o) => { if (!confirm("অর্ডারটা মুছে ফেলবে?")) return; try { await api("api/orders?id=" + o.id, { method: "DELETE" }); load(); } catch (e) { setErr(e.message); } };
  const csv = () => {
    const cols = ["created", "status", "title", "type", "price", "name", "phone", "email", "address", "method", "trx", "note"];
    const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const text = "﻿" + [cols.join(","), ...list.map((o) => cols.map((c) => q(o[c])).join(","))].join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" }));
    a.download = "eloraed-orders.csv"; a.click();
  };
  const shown = (list || []).filter((o) => filter === "all" || o.status === filter);
  const when = (s) => new Date(s).toLocaleString("bn-BD", { dateStyle: "medium", timeStyle: "short" });
  return html`<div className="panel">
    <div className="dtop" style=${{ marginBottom: 6 }}>
      <div style=${{ marginRight: "auto" }}><h2>অর্ডার</h2><p className="hint" style=${{ margin: 0 }}>TrxID মিলিয়ে দেখে স্ট্যাটাস বদলাও।</p></div>
      <button className="btn" onClick=${load}>রিফ্রেশ</button>
      ${list && list.length > 0 && html`<button className="btn" onClick=${csv}>CSV ডাউনলোড</button>`}
    </div>
    <div className="chips" style=${{ margin: "10px 0 6px" }}>
      ${[["all", "সব"], ...Object.entries(STATUS)].map(([k, v]) => html`<button key=${k} className=${filter === k ? "on" : ""} onClick=${() => setFilter(k)}>${v}${list ? " " + bn(k === "all" ? list.length : list.filter((o) => o.status === k).length) : ""}</button>`)}
    </div>
    ${err && html`<p className="msg bad">${err}</p>`}
    ${list === null ? html`<p className="hint">লোড হচ্ছে…</p>` : shown.length === 0 ? html`<p className="hint">এখানে কোনো অর্ডার নেই।</p>` :
      shown.map((o) => html`<div key=${o.id} className="ocard">
        <div>
          <h3>${o.title} <span className="tag">${o.type}</span></h3>
          <dl>
            <dt>দাম</dt><dd>${o.price ? taka(o.price) : "ফ্রি"}</dd>
            <dt>নাম</dt><dd>${o.name}</dd>
            <dt>ফোন</dt><dd><a href=${"tel:" + o.phone} style=${{ color: "var(--orange-2)", fontWeight: 700 }}>${o.phone}</a> · <a href=${"https://wa.me/88" + o.phone} target="_blank" rel="noopener">WhatsApp</a></dd>
            ${o.email && html`<dt>ইমেইল</dt><dd>${o.email}</dd>`}
            ${o.address && html`<dt>ঠিকানা</dt><dd>${o.address}</dd>`}
            ${o.method && html`<dt>পেমেন্ট</dt><dd>${o.method}${o.trx ? " · TrxID " + o.trx : ""}</dd>`}
            ${o.note && html`<dt>নোট</dt><dd>${o.note}</dd>`}
            <dt>সময়</dt><dd>${when(o.created)}</dd>
          </dl>
        </div>
        <div className="side">
          <span className=${"st " + o.status}>${STATUS[o.status]}</span>
          <label className="f"><select value=${o.status} onChange=${(e) => setStatus(o, e.target.value)}>${Object.entries(STATUS).map(([k, v]) => html`<option key=${k} value=${k}>${v}</option>`)}</select></label>
          <button className="btn red" onClick=${() => del(o)}>মুছো</button>
        </div>
      </div>`)}
  </div>`;
}

function Settings() {
  const [s, setS] = useState(null);
  const [msg, setMsg] = useState("");
  const [err, setErr] = useState("");
  useEffect(() => { api("api/settings").then((d) => setS(d.settings)).catch((e) => setErr(e.message)); }, []);
  const set = (k) => (e) => setS({ ...s, [k]: e.target.value });
  const save = async (e) => {
    e.preventDefault(); setMsg(""); setErr("");
    try { const d = await api("api/settings", { method: "POST", json: s }); setS(d.settings); setMsg("সেভ হয়েছে।"); } catch (e2) { setErr(e2.message); }
  };
  if (!s) return html`<div className="panel">${err ? html`<p className="msg bad">${err}</p>` : html`<p className="hint">লোড হচ্ছে…</p>`}</div>`;
  return html`<form className="panel" onSubmit=${save} style=${{ maxWidth: 720 }}>
    <h2>সেটিংস</h2><p className="hint">অর্ডার করার সময় ক্রেতা এগুলো দেখবে।</p>
    ${msg && html`<p className="msg ok">${msg}</p>`}${err && html`<p className="msg bad">${err}</p>`}
    <div className="fgrid">
      <label className="f">bKash নম্বর<input value=${s.bkash} onInput=${set("bkash")} placeholder="01XXXXXXXXX (খালি রাখলে bKash দেখাবে না)" /></label>
      <label className="f">Nagad নম্বর<input value=${s.nagad} onInput=${set("nagad")} placeholder="খালি রাখলে Nagad দেখাবে না" /></label>
      <label className="f full">পেমেন্টের নির্দেশনা<textarea rows="3" value=${s.payNote} onInput=${set("payNote")} placeholder="Send Money করো, রেফারেন্সে নিজের নাম লেখো। ২৪ ঘণ্টার মধ্যে কনফার্ম করবো।"></textarea></label>
      <label className="f">যোগাযোগের ফোন<input value=${s.phone} onInput=${set("phone")} /></label>
      <label className="f">WhatsApp<input value=${s.whatsapp} onInput=${set("whatsapp")} /></label>
      <label className="f full">শপের ঘোষণা <small>(শপের ওপরে দেখাবে; খালি রাখলে কিছু দেখাবে না)</small><input value=${s.notice} onInput=${set("notice")} placeholder="যেমন: ঈদ উপলক্ষে সব নোটে ২০% ছাড়!" /></label>
    </div>
    <div className="bar"><button className="pill pill-orange">সেভ করো</button></div>
  </form>`;
}

function Dash() {
  const [tab, setTab] = useState("products");
  const [newCount, setNewCount] = useState(0);
  useEffect(() => { api("api/orders").then((d) => setNewCount(d.orders.filter((o) => o.status === "new").length)).catch(() => {}); }, []);
  return html`<div className="wrap dash">
    <div className="dtop">
      <a className="logo" href="./"><img src="img/logo.png" alt="" />ড্যাশবোর্ড</a>
      <div className="dtabs">
        <button className=${tab === "products" ? "on" : ""} onClick=${() => setTab("products")}>পণ্য</button>
        <button className=${tab === "orders" ? "on" : ""} onClick=${() => setTab("orders")}>অর্ডার${newCount > 0 && html`<i>${bn(newCount)}</i>`}</button>
        <button className=${tab === "settings" ? "on" : ""} onClick=${() => setTab("settings")}>সেটিংস</button>
      </div>
      <button className="btn" onClick=${() => { store.clear(); location.reload(); }}>লগ আউট</button>
    </div>
    ${tab === "products" && html`<${Products} />`}
    ${tab === "orders" && html`<${Orders} onCount=${setNewCount} />`}
    ${tab === "settings" && html`<${Settings} />`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(PW ? html`<${Dash} />` : html`<${Login} />`);
</script>
